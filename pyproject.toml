[project]
name = "autonomous-ml-lab"
version = "0.1.0"
description = "Autonomous ML Research Lab: deterministic ML foundation with agentic orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mannat Goyal", email = "mannatgoyal2810@gmail.com" }
]
keywords = [
    "machine-learning",
    "autonomous-agents",
    "mcp",
    "mlflow",
    "fastapi",
    "reproducible-research"
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "xgboost>=2.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "torch>=2.2.0",
    "mlflow>=2.10.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "mcp>=1.0.0",
    "anyio>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/mannatgoyal/auto_research_lab"
Repository = "https://github.com/mannatgoyal/auto_research_lab"
Issues = "https://github.com/mannatgoyal/auto_research_lab/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml", "orchestrator", "mcp_servers", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
